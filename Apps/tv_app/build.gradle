import com.github.jk1.license.render.JsonReportRenderer

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        // Updated versions - November 2024
        compose_version = '1.7.5'
        compose_bom_version = '2024.11.00'
        kotlin_version = '2.0.21'
        hilt_version = '2.52'
        room_version = '2.6.1'
        retrofit_version = '2.11.0'
        okhttp_version = '4.12.0'
        media3_version = '1.5.0'
        navigation_version = '2.8.4'
        lifecycle_version = '2.8.7'
        activity_compose_version = '1.9.3'
        hilt_nav_version = '1.2.0'
        datastore_version = '1.1.1'
        coil_version = '2.7.0'
        coroutines_version = '1.9.0'
        gson_version = '2.11.0'
        splashscreen_version = '1.0.1'
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "com.github.jk1:gradle-license-report:2.6"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'com.android.library' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
    id 'com.google.devtools.ksp' version '2.0.21-1.0.27' apply false
    id 'com.google.dagger.hilt.android' version '2.52' apply false
}

// Repositories are now managed in settings.gradle

task clean(type: Delete) {
    delete rootProject.buildDir
}

apply plugin: 'com.github.jk1.dependency-license-report'

def licenseReportRoot = new File(rootProject.rootDir.parentFile.parentFile, 'reports')
licenseReportRoot.mkdirs()

licenseReport {
    outputDir = licenseReportRoot
    configurations = ['releaseRuntimeClasspath']
    renderers = [new JsonReportRenderer('THIRD_PARTY_LICENSES.android.json', false)]
}
