[package]
name = "iptv-backend"
version = "1.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
bcrypt = "0.15"
lazy_static = "1.4"
tracing = "0.1"
jsonwebtoken = "9.2"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "cookies"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
regex = "1.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["std"] }
rand = "0.8"
rpassword = "7.0"
walkdir = "2.5"
tokio-util = "0.7"
mime_guess = "2.0"
bytes = "1.0"
http-body-util = "0.1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1.0"
once_cell = "1.19"
moka = { version = "0.12", features = ["future"] }
libc = "0.2"
whatlang = "0.16"
sysinfo = "0.33.1"

# Music module dependencies
blowfish = "0.9"
cbc = "0.1"
md-5 = "0.10"
generic-array = "0.14"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
id3 = "1.13"
urlencoding = "2.1"
path-absolutize = "3.1"

# Email (SMTP)
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool"] }

# 2FA (TOTP)
totp-rs = { version = "5.5", features = ["qr", "gen_secret"] }


[[bin]]
name = "iptv-backend"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
serial_test = "3.0"
rstest = "0.18"

[build-dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
dotenvy = "0.15"
bcrypt = "0.15"
tracing = "0.1"
